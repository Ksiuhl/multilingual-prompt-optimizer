[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-prompt-optimizer"
version = "0.4.0"
description = "Tokenizer-aware prompt candidate selection with protected source payloads"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/PROMPTMIN_LICENSE"]
dependencies = [
  "tiktoken>=0.14,<0.15",
  "promptminify==0.3.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
]

[project.optional-dependencies]
hf = ["tokenizers>=0.23,<0.24"]
dev = ["build>=1.2", "ruff>=0.17,<0.18"]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
mpo = "multilingual_prompt_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multilingual_prompt_optimizer = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
